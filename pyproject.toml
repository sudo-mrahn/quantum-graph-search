[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-graph-search"
version = "0.1.0"
description = "Research companion code for graph generation, classical walks, Grover walks, and quantum search on graphs."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name = "Alex Song Ahn" },
]
dependencies = [
  "matplotlib>=3.5",
  "networkx>=2.6",
  "numpy>=1.20",
  "scipy>=1.8",
]

[project.optional-dependencies]
test = [
  "pytest>=7",
]

[tool.setuptools.packages.find]
include = ["cw*", "graph*", "qs*", "qw*", "quantum_graph_search*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
